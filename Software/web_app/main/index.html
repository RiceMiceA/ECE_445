<!DOCTYPE html>
<html>
    <head>
        <Title>
            NuChef AI Culinary Assistant + Spice Dispenser
        </Title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>NuChef Culinary Assistant Spice Tracker</h1>
        <h2>Configure Containers</h2>
        <div id="container-set">
            <input id="container1" placeholder="Container 1 Spice">
            <input id="container2" placeholder="Container 2 Spice">
            <input id="container3" placeholder="Container 3 Spice">
            <button id="setContainersBtn">Set Containers</button>
        </div>

        <h2>Connect to ESP</h2>
        <div id="ESP-connection">
            <input id="IP_Input" placeholder="ESP IP Address">
            <button id="spinMotor">Spin Motor</button>
        </div>


        <h2>Spice Container Levels</h2>
        <div id="containers"></div>

        <script src="script.js"></script>
    </body>
</html>
